<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>人生选择实验室</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a1a;--bg2:#0f0f2a;--card:rgba(26,26,46,0.85);--card-solid:#1a1a2e;--card-hover:rgba(42,42,78,0.85);
  --text:#ffffff;--sub:#7a8ba0;
  --accent:#00d4ff;--accent-glow:rgba(0,212,255,0.3);--accent-bright:rgba(0,212,255,0.6);
  --accent2:#7C83FD;--accent2-glow:rgba(124,131,253,0.3);
  --bar-bg:#1a2a3e;--bar-fg:#00d4ff;
  --danger:#ff4444;--success:#00ff88;--warning:#F0A500;
  --radius:12px;
  --shadow:0 0 20px rgba(0,212,255,0.08);
  --glow-shadow:0 0 15px rgba(0,212,255,0.2);
  --glass:saturate(180%) blur(12px);
}
html{overflow-x:hidden}
body{min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB",sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden;overflow-y:auto}
body::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;
  background:
    radial-gradient(ellipse 600px 400px at 15% 30%,rgba(0,212,255,0.18) 0%,transparent 70%),
    radial-gradient(ellipse 500px 500px at 85% 15%,rgba(124,131,253,0.14) 0%,transparent 70%),
    radial-gradient(ellipse 400px 600px at 50% 85%,rgba(150,0,255,0.12) 0%,transparent 70%),
    radial-gradient(ellipse 300px 300px at 70% 60%,rgba(0,212,255,0.08) 0%,transparent 70%);
  pointer-events:none;z-index:0}
body::after{content:'';position:fixed;top:-50%;left:-50%;right:-50%;bottom:-50%;
  background:radial-gradient(ellipse at center,rgba(0,212,255,0.06) 0%,transparent 50%);
  animation:nebulaDrift 20s ease-in-out infinite;pointer-events:none;z-index:0}
@keyframes nebulaDrift{0%{transform:translate(0,0) rotate(0deg)}33%{transform:translate(3%,2%) rotate(1deg)}66%{transform:translate(-2%,3%) rotate(-1deg)}100%{transform:translate(0,0) rotate(0deg)}}

.screen{display:none;min-height:100vh;padding:24px 20px 40px;max-width:480px;margin:0 auto;position:relative;z-index:1}
.screen.active{display:flex;flex-direction:column}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes glowText{0%,100%{text-shadow:0 0 8px var(--accent-glow)}50%{text-shadow:0 0 20px var(--accent-bright)}}
@keyframes barGrow{from{width:0}to{width:var(--w)}}
@keyframes cosmicBorderGlow{0%,100%{border-color:rgba(0,212,255,0.15)}50%{border-color:rgba(0,212,255,0.4)}}
@keyframes scanMove{0%{top:0}100%{top:100%}}
@keyframes starTwinkle{0%,100%{opacity:0.3;transform:scale(1)}50%{opacity:1;transform:scale(1.8)}}
@keyframes floatUp{0%{opacity:0;transform:translateY(20px) scale(0.5)}30%{opacity:0.7;transform:translateY(-10px) scale(1)}70%{opacity:0.4}100%{opacity:0;transform:translateY(-100px) scale(0.3)}}
@keyframes orbit{0%{transform:rotate(0deg) translateX(var(--orbit-r)) rotate(0deg)}100%{transform:rotate(360deg) translateX(var(--orbit-r)) rotate(-360deg)}}
@keyframes glowLinePulse{0%,100%{opacity:0.3}50%{opacity:0.8}}
@keyframes effectsFadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes effectsFadeOut{from{opacity:1}to{opacity:0;transform:translateY(-4px)}}
@keyframes gridPulse{0%,100%{opacity:0.06}50%{opacity:0.12}}
@keyframes meteorFall{0%{transform:translate(0,0) rotate(-45deg);opacity:0}10%{opacity:1}90%{opacity:0.9}100%{transform:translate(-300px,300px) rotate(-45deg);opacity:0}}

/* HOME */
.home{align-items:center;justify-content:center;text-align:center}
.home-title{font-size:36px;font-weight:800;letter-spacing:6px;line-height:1.3;margin-bottom:14px;color:var(--accent);animation:glowText 3s ease-in-out infinite}
.home-subtitle{font-size:15px;color:var(--sub);line-height:1.8;margin-bottom:44px}
.btn-primary{display:inline-flex;align-items:center;justify-content:center;padding:16px 52px;background:transparent;color:var(--accent);border:1px solid var(--accent);border-radius:4px;font-size:16px;font-weight:600;cursor:pointer;transition:all .3s;letter-spacing:2px;position:relative;overflow:hidden;animation:cosmicBorderGlow 3s ease-in-out infinite}
.btn-primary::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(0,212,255,0.12),transparent);transition:left .6s}
.btn-primary:hover{background:rgba(0,212,255,0.08);box-shadow:var(--glow-shadow);transform:translateY(-2px)}
.btn-primary:hover::before{left:100%}
.home-meta{margin-top:28px;font-size:12px;color:var(--sub);letter-spacing:1px}
.home-orbits{position:absolute;width:300px;height:300px;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}
.orbit-dot{position:absolute;width:4px;height:4px;background:var(--accent);border-radius:50%;top:50%;left:50%;margin:-2px;animation:orbit linear infinite;opacity:0.3}
.orbit-ring{position:absolute;top:50%;left:50%;border:1px solid rgba(0,212,255,0.06);border-radius:50%;transform:translate(-50%,-50%)}

/* GAME */
.game{padding-top:16px}
.game-inner{transition:opacity .25s ease}
.progress-wrap{margin-bottom:20px;padding:14px 18px;background:var(--card);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid rgba(0,212,255,0.12);border-radius:10px}
.progress-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.progress-phase{font-size:12px;color:var(--accent);font-weight:600;letter-spacing:1px}
.progress-age{font-size:12px;color:var(--sub);font-family:monospace}
.progress-track{width:100%;height:4px;background:var(--bar-bg);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;transition:width .5s ease;box-shadow:0 0 6px var(--accent-glow)}
.q-scenario{font-size:16px;color:var(--sub);line-height:1.9;margin-bottom:20px;padding:18px;background:var(--card);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid rgba(0,212,255,0.08);border-radius:var(--radius);position:relative}
.q-scenario::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent-glow),transparent)}
.options{display:flex;flex-direction:column;gap:10px}
.option-card{padding:18px 20px;background:var(--card);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid rgba(0,212,255,0.1);border-radius:var(--radius);cursor:pointer;transition:all .25s;line-height:1.5;position:relative}
.option-card:hover{border-color:var(--accent);background:var(--card-hover);box-shadow:var(--glow-shadow);transform:translateX(4px)}
.option-card.selected{border-color:var(--accent);background:rgba(0,212,255,0.08);pointer-events:none;box-shadow:0 0 20px var(--accent-glow)}
.option-card.disabled{opacity:0.4;pointer-events:none}
.option-title{font-size:16px;font-weight:600}
.option-desc{font-size:14px;color:var(--sub);margin-top:3px}
.inline-effects{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;animation:effectsFadeIn .4s ease both}
.inline-effects.hiding{animation:effectsFadeOut .3s ease both}
.effect-tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;font-family:monospace}
.effect-tag.positive{color:var(--success);background:rgba(0,255,136,0.1)}
.effect-tag.negative{color:var(--danger);background:rgba(255,68,68,0.1)}
.transition-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .35s}
.transition-overlay.show{opacity:1;pointer-events:all}
.transition-text{font-size:15px;color:var(--sub);text-align:center;padding:0 32px;line-height:1.9;max-width:380px;font-style:italic}

/* RESULT */
.result{align-items:center}
.result-header{text-align:center;margin-bottom:32px;animation:slideUp .6s ease}
.result-label{font-size:12px;color:var(--accent);font-weight:600;letter-spacing:4px;margin-bottom:12px}
.result-emoji{font-size:72px;margin-bottom:14px;filter:drop-shadow(0 0 20px rgba(0,212,255,0.3))}
.result-type{font-size:34px;font-weight:800;margin-bottom:10px;color:var(--accent);animation:glowText 3s ease-in-out infinite}
.result-oneliner{font-size:15px;color:#b0bec5;line-height:1.8;max-width:360px;margin:0 auto}
.profile-card{width:100%;background:linear-gradient(145deg,rgba(20,20,50,0.95),rgba(12,12,35,0.98));backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid rgba(0,212,255,0.18);border-radius:var(--radius);padding:24px;margin-bottom:22px;animation:slideUp .6s ease .1s both;position:relative;overflow:hidden;box-shadow:0 4px 30px rgba(0,0,0,0.3),inset 0 1px 0 rgba(0,212,255,0.08)}
.profile-card::before{content:'';display:block;height:2px;background:linear-gradient(90deg,transparent,rgba(0,212,255,0.5),rgba(124,131,253,0.4),transparent);margin-bottom:18px}
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.profile-item{text-align:center;padding:14px 10px;background:rgba(0,212,255,0.03);border-radius:10px;border:1px solid rgba(0,212,255,0.08);transition:all .3s}
.profile-item:hover{border-color:rgba(0,212,255,0.2);background:rgba(0,212,255,0.06)}
.profile-item .label{font-size:12px;color:var(--sub);margin-bottom:6px;letter-spacing:1px}
.profile-item .value{font-size:16px;font-weight:700;color:#e0e8f0}
.radar-wrap{width:100%;background:linear-gradient(145deg,rgba(20,20,50,0.95),rgba(12,12,35,0.98));backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid rgba(0,212,255,0.18);border-radius:var(--radius);padding:24px;margin-bottom:22px;animation:slideUp .6s ease .2s both;text-align:center;position:relative;overflow:hidden;box-shadow:0 4px 30px rgba(0,0,0,0.3),inset 0 1px 0 rgba(0,212,255,0.08)}
.radar-wrap canvas{max-width:300px;margin:0 auto;display:block}
.attrs-list{width:100%;margin-bottom:22px;animation:slideUp .6s ease .3s both}
.attr-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.attr-name{width:36px;font-size:13px;font-weight:700;text-align:right;flex-shrink:0;color:var(--sub)}
.attr-bar-bg{flex:1;height:8px;background:var(--bar-bg);border-radius:4px;overflow:hidden}
.attr-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:4px;animation:barGrow 1s ease both;box-shadow:0 0 6px var(--accent-glow)}
.attr-val{width:30px;font-size:14px;font-weight:700;text-align:right;flex-shrink:0;font-family:monospace;color:var(--accent)}
.story-card{width:100%;background:linear-gradient(145deg,rgba(20,20,50,0.95),rgba(12,12,35,0.98));backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid rgba(0,212,255,0.18);border-radius:var(--radius);padding:24px;margin-bottom:22px;animation:slideUp .6s ease .4s both;position:relative;overflow:hidden;box-shadow:0 4px 30px rgba(0,0,0,0.3),inset 0 1px 0 rgba(0,212,255,0.08)}
.story-card p{font-size:14px;line-height:2;color:#b0bec5;margin-bottom:12px}
.story-card p:last-child{margin-bottom:0}
.story-card strong{color:#fff;text-shadow:0 0 8px rgba(0,212,255,0.3)}
.section-label{font-size:13px;color:var(--accent);font-weight:700;margin-bottom:16px;letter-spacing:3px;text-shadow:0 0 10px rgba(0,212,255,0.2)}

/* PARALLEL */
.parallel-section{width:100%;animation:slideUp .6s ease .5s both;margin-bottom:20px}
.parallel-title{font-size:20px;font-weight:800;text-align:center;margin-bottom:18px;color:var(--accent);text-shadow:0 0 12px rgba(0,212,255,0.3)}
.parallel-changes{margin-bottom:16px;padding:16px;background:var(--card);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid rgba(0,212,255,0.08);border-radius:var(--radius)}
.parallel-change-item{font-size:12px;color:var(--sub);line-height:1.7;margin-bottom:8px;padding-left:14px;border-left:2px solid var(--accent-glow);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.parallel-change-item:last-child{margin-bottom:0}
.parallel-change-item .age-tag{color:var(--accent);font-weight:700;font-family:monospace;background:rgba(0,212,255,0.06);padding:1px 6px;border-radius:3px;font-size:11px}
.parallel-change-item .old-choice{text-decoration:line-through;opacity:0.5}
.parallel-change-item .new-choice{color:var(--accent);font-weight:600}
.parallel-compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.parallel-col{background:var(--card);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid rgba(0,212,255,0.08);border-radius:var(--radius);padding:16px;text-align:center}
.parallel-col .col-emoji{font-size:36px;margin-bottom:8px}
.parallel-col .col-type{font-size:15px;font-weight:700;margin-bottom:14px}
.parallel-col .col-attr{display:flex;align-items:center;gap:4px;margin-bottom:6px}
.parallel-col .col-attr .a-name{font-size:10px;width:24px;text-align:right;color:var(--sub)}
.parallel-col .col-attr .a-bar-bg{flex:1;height:4px;background:var(--bar-bg);border-radius:2px;overflow:hidden}
.parallel-col .col-attr .a-bar{height:100%;border-radius:2px}
.parallel-col .col-attr .a-val{font-size:10px;font-weight:600;width:20px;text-align:right;font-family:monospace}
.parallel-col.mine{border-color:rgba(0,212,255,0.2)}
.parallel-col.mine .col-type{color:var(--accent)}
.parallel-col.alt{border-color:rgba(240,165,0,0.2)}
.parallel-col.alt .col-type{color:var(--warning)}
.parallel-col.alt .a-bar{background:var(--warning)}
.parallel-diff{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.diff-tag{font-size:11px;font-family:monospace;padding:2px 8px;border-radius:4px}
.diff-tag.up{color:var(--success);background:rgba(0,255,136,0.1)}
.diff-tag.down{color:var(--danger);background:rgba(255,68,68,0.1)}
.parallel-hint{font-size:14px;color:#b0bec5;text-align:center;line-height:1.9;margin-top:16px;font-style:italic}
.alt-life-btn{display:block;width:100%;margin-top:16px;padding:16px;background:linear-gradient(135deg,rgba(240,165,0,0.08),rgba(255,140,0,0.04));border:1px solid rgba(240,165,0,0.25);border-radius:var(--radius);cursor:pointer;text-align:center;color:var(--warning);font-size:14px;font-weight:700;transition:all .3s;letter-spacing:1px}
.alt-life-btn:hover{background:rgba(240,165,0,0.12);box-shadow:0 0 15px rgba(240,165,0,0.15)}
.alt-life-detail{display:none;margin-top:14px;padding:20px;background:var(--card);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid rgba(240,165,0,0.15);border-radius:var(--radius);animation:slideUp .4s ease}
.alt-life-detail.show{display:block}
.alt-life-detail .alt-header{text-align:center;margin-bottom:16px}
.alt-life-detail .alt-emoji{font-size:40px;margin-bottom:8px}
.alt-life-detail .alt-type{font-size:20px;font-weight:700;color:var(--warning);margin-bottom:4px}
.alt-life-detail .alt-oneliner{font-size:12px;color:var(--sub);line-height:1.6}
.alt-life-detail .alt-profile{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.alt-life-detail .alt-profile-item{text-align:center;padding:8px;background:rgba(240,165,0,0.03);border:1px solid rgba(240,165,0,0.08);border-radius:6px}
.alt-life-detail .alt-profile-item .label{font-size:10px;color:var(--sub);margin-bottom:2px}
.alt-life-detail .alt-profile-item .value{font-size:13px;font-weight:600;color:var(--warning)}
.alt-life-detail .alt-story p{font-size:13px;line-height:1.8;color:var(--sub);margin-bottom:8px}
.alt-life-detail .alt-story strong{color:var(--warning)}

/* RESULT ENHANCED */
.result-header{position:relative}
.result-header::before{content:'';position:absolute;top:-60px;left:50%;transform:translateX(-50%);width:320px;height:320px;background:radial-gradient(circle,rgba(0,212,255,0.2) 0%,rgba(124,131,253,0.08) 40%,transparent 70%);pointer-events:none;z-index:-1;animation:headerGlow 4s ease-in-out infinite}
@keyframes headerGlow{0%,100%{opacity:0.7;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.1)}}
.result-badge{display:inline-block;padding:8px 24px;border:1px solid rgba(0,212,255,0.35);border-radius:24px;font-size:12px;color:var(--accent);letter-spacing:4px;margin-bottom:18px;background:linear-gradient(135deg,rgba(0,212,255,0.06),rgba(124,131,253,0.04));backdrop-filter:blur(4px);text-shadow:0 0 8px rgba(0,212,255,0.3)}
.result-emoji{position:relative}
.result-emoji::after{content:'';position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);width:80px;height:3px;background:linear-gradient(90deg,transparent,var(--accent),var(--accent2),transparent);border-radius:2px}
.result-type{background:linear-gradient(135deg,#00d4ff,#7C83FD,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 12px rgba(0,212,255,0.3))}
.result-income-tag{display:inline-block;margin-top:8px;padding:6px 18px;background:linear-gradient(135deg,rgba(0,212,255,0.08),rgba(124,131,253,0.06));border:1px solid rgba(0,212,255,0.2);border-radius:20px;font-size:14px;color:var(--accent);font-weight:600;font-family:monospace}
.result-rarity{display:inline-flex;align-items:center;gap:7px;margin-top:12px;padding:6px 18px;background:linear-gradient(135deg,rgba(124,131,253,0.1),rgba(0,212,255,0.08));border:1px solid rgba(124,131,253,0.25);border-radius:24px;font-size:13px;color:#a5b4fc;font-weight:600;letter-spacing:0.5px}
.result-rarity .rarity-dot{width:7px;height:7px;border-radius:50%;background:#a5b4fc;box-shadow:0 0 8px rgba(165,180,252,0.5);animation:raritPulse 2s ease-in-out infinite}
@keyframes raritPulse{0%,100%{opacity:0.6;transform:scale(1)}50%{opacity:1;transform:scale(1.4)}}
.attr-row-enhanced{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding:10px 14px;background:rgba(255,255,255,0.02);border-radius:10px;border:1px solid rgba(255,255,255,0.04);transition:all .3s}
.attr-row-enhanced:hover{border-color:rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);transform:translateX(2px)}
.attr-icon{font-size:20px;flex-shrink:0}
.attr-bar-enhanced{height:10px;border-radius:5px;position:relative;overflow:hidden}
.attr-bar-enhanced::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,0.2) 50%,transparent 100%);animation:barShine 3s ease-in-out infinite}
@keyframes barShine{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.attr-level{font-size:11px;padding:3px 8px;border-radius:4px;font-weight:700;letter-spacing:0.5px}
.attr-level.high{color:#00ff88;background:rgba(0,255,136,0.15);text-shadow:0 0 6px rgba(0,255,136,0.3)}
.attr-level.mid{color:#60d4ff;background:rgba(0,212,255,0.12);text-shadow:0 0 6px rgba(0,212,255,0.2)}
.attr-level.low{color:#ffb347;background:rgba(240,165,0,0.12);text-shadow:0 0 6px rgba(240,165,0,0.2)}
.story-card .story-lead{font-size:16px;color:#fff;font-weight:700;line-height:1.9;margin-bottom:14px;text-shadow:0 0 8px rgba(0,212,255,0.15)}
/* glow line enhancement */
.glow-line{height:2px;background:linear-gradient(90deg,transparent,rgba(0,212,255,0.4),rgba(124,131,253,0.5),rgba(0,212,255,0.4),transparent);margin:24px 0;animation:glowLinePulse 3s ease-in-out infinite;box-shadow:0 0 8px rgba(0,212,255,0.15)}

/* BUTTONS */
.action-btns{display:flex;flex-direction:column;gap:14px;width:100%;margin-top:16px;animation:slideUp .6s ease .6s both}
.btn-secondary{padding:16px;background:transparent;border:1px solid rgba(0,212,255,0.3);color:var(--accent);border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;transition:all .3s;text-align:center;letter-spacing:1px}
.btn-secondary:hover{background:rgba(0,212,255,0.08);box-shadow:0 0 20px rgba(0,212,255,0.15);transform:translateY(-2px)}

/* SHARE MODAL */
.share-modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.8);backdrop-filter:blur(6px);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.share-modal.show{display:flex}
.share-content{background:var(--bg2);border:1px solid rgba(0,212,255,0.15);border-radius:var(--radius);padding:20px;max-width:380px;width:100%;max-height:90vh;overflow-y:auto;text-align:center}
.share-content canvas{width:100%;border-radius:8px;margin-bottom:16px}
.share-tip{font-size:12px;color:var(--sub);margin-bottom:16px}
.share-close{padding:10px 28px;background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:4px;font-size:14px;cursor:pointer;transition:all .2s}
.share-close:hover{background:rgba(0,212,255,0.1)}

/* ORIGIN */
.origin{padding-top:40px}
.origin-step{font-size:11px;color:var(--accent);font-weight:600;letter-spacing:2px;margin-bottom:12px;font-family:monospace}
.origin-q{font-size:20px;font-weight:700;margin-bottom:22px;line-height:1.4}
.origin-options{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.origin-opt{padding:14px 18px;background:var(--card);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid rgba(0,212,255,0.1);border-radius:var(--radius);cursor:pointer;font-size:14px;font-weight:500;transition:all .25s}
.origin-opt:hover{border-color:var(--accent);background:var(--card-hover);transform:translateX(4px)}
.origin-opt.selected{border-color:var(--accent);background:rgba(0,212,255,0.06);font-weight:600;box-shadow:var(--glow-shadow)}

/* DECORATIONS */
.stars{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:0;overflow:hidden}
.star{position:absolute;width:2px;height:2px;background:rgba(0,212,255,0.4);border-radius:50%;animation:starTwinkle 3s ease-in-out infinite}
/* .glow-line defined in RESULT ENHANCED section */
.corner-deco{position:absolute;width:16px;height:16px;border-color:var(--accent);opacity:0.55}
.corner-deco.tl{top:-1px;left:-1px;border-top:1px solid;border-left:1px solid}
.corner-deco.tr{top:-1px;right:-1px;border-top:1px solid;border-right:1px solid}
.corner-deco.bl{bottom:-1px;left:-1px;border-bottom:1px solid;border-left:1px solid}
.corner-deco.br{bottom:-1px;right:-1px;border-bottom:1px solid;border-right:1px solid}
.card-decorated{position:relative}
.scan-line{position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent-bright),transparent);animation:scanMove 5s linear infinite;opacity:0.2;pointer-events:none}
.float-particle{position:absolute;width:3px;height:3px;background:var(--accent);border-radius:50%;opacity:0;animation:floatUp 6s ease-in-out infinite;pointer-events:none}
/* Grid overlay for PC */
.grid-overlay{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(0,212,255,0.06) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.06) 1px,transparent 1px);
  background-size:60px 60px;animation:gridPulse 6s ease-in-out infinite}
/* Meteor */
.meteor{position:fixed;width:150px;height:2px;background:linear-gradient(90deg,rgba(0,212,255,1),rgba(124,131,253,0.6),transparent);box-shadow:0 0 8px rgba(0,212,255,0.6),0 0 20px rgba(0,212,255,0.3);pointer-events:none;z-index:0;animation:meteorFall 4s linear infinite;opacity:0}
/* Side decoration lines for PC */
.side-deco{position:fixed;top:20%;width:1px;height:60%;pointer-events:none;z-index:0;opacity:0}
.side-deco.left{left:8%;background:linear-gradient(to bottom,transparent,rgba(0,212,255,0.4),transparent)}
.side-deco.right{right:8%;background:linear-gradient(to bottom,transparent,rgba(124,131,253,0.4),transparent)}
/* Hex grid dots for PC */
.hex-dot{position:fixed;width:6px;height:6px;border:1px solid rgba(0,212,255,0.15);border-radius:50%;pointer-events:none;z-index:0;box-shadow:0 0 4px rgba(0,212,255,0.1)}
/* Star trail rings */
@keyframes orbitTrail{0%{transform:translate(-50%,-50%) rotate(0deg)}100%{transform:translate(-50%,-50%) rotate(360deg)}}
.star-trail{position:fixed;border-radius:50%;pointer-events:none;z-index:0;border:1px solid transparent;border-top-color:rgba(0,212,255,0.15);border-right-color:rgba(124,131,253,0.08);animation:orbitTrail linear infinite}
.star-trail.t1{width:500px;height:500px;top:20%;left:50%;animation-duration:40s;border-top-color:rgba(0,212,255,0.12)}
.star-trail.t2{width:700px;height:700px;top:40%;left:45%;animation-duration:60s;border-top-color:rgba(124,131,253,0.1);animation-direction:reverse}
.star-trail.t3{width:350px;height:350px;top:60%;left:55%;animation-duration:30s;border-top-color:rgba(0,212,255,0.08)}

/* PC responsive */
@media(min-width:768px){
  .screen{max-width:540px;padding:32px 24px 48px}
  .home-title{font-size:44px;letter-spacing:8px}
  .result-type{font-size:32px}
  .side-deco{opacity:0.4}
}
@media(min-width:1024px){

  .side-deco{opacity:0.6}
}
@media(min-width:1400px){
  .screen{max-width:640px}
  .side-deco{opacity:0.8}
}
</style>
</head>

// ======== ENGINE ========
const ATTRS = ['career','wealth','love','freedom','happiness'];
const ATTR_NAMES = {career:'Career',wealth:'Wealth',love:'Love',freedom:'Freedom',happiness:'Happiness'};
const ATTR_NAMES_CN = {career:'事业',wealth:'财富',love:'爱情',freedom:'自由',happiness:'幸福'};

let state = {
  timeline:null,riskTaker:false,userStage:'',
  attrs:{career:50,wealth:50,love:50,freedom:50,happiness:50},
  choices:[],allQuestions:[],currentQIdx:0,originStep:0,originAnswers:[]
};

function clamp(v){return Math.max(0,Math.min(100,Math.round(v)))}
function applyEffects(effects,phase,riskTaker,riskBonus){
  const w=PHASE_WEIGHTS[phase]||{career:1,wealth:1,love:1,freedom:1,happiness:1};
  const result={};
  ATTRS.forEach(a=>{let v=(effects[a]||0)*(w[a]||1);if(riskTaker&&riskBonus&&riskBonus[a])v+=riskBonus[a];result[a]=v;});
  return result;
}
function calcAttrs(choices,allQuestions,riskTaker){
  const attrs={career:50,wealth:50,love:50,freedom:50,happiness:50};
  choices.forEach(c=>{const q=allQuestions.find(qq=>qq.id===c.questionId);if(!q)return;const opt=q.options.find(o=>o.id===c.optionId);if(!opt)return;const eff=applyEffects(opt.effects,q.phase,riskTaker,opt.riskBonus);ATTRS.forEach(a=>{attrs[a]+=eff[a];});});
  ATTRS.forEach(a=>{attrs[a]=clamp(attrs[a]);});
  return attrs;
}
// ======== SCORING-BASED TYPE MATCHING ========
const TYPE_MATCHERS=[
  {id:'hustler',
    gate:s=>s.career>=70&&s.wealth>=60&&s.freedom<60,
    fit:s=>{let f=0;f+=Math.min(30,(s.career-70)*2);f+=Math.min(20,(s.wealth-60)*1.5);f+=Math.min(20,(60-s.freedom)*1.5);f+=Math.min(15,Math.max(0,65-s.love));if(s.love>=65)f-=(s.love-65)*2;f+=10;return f;}},
  {id:'ambitious',
    gate:s=>s.career>=65&&s.wealth>=65,
    fit:s=>{let f=0;f+=Math.min(25,(s.wealth-65)*1.5);f+=Math.min(20,(s.career-65)*1.5);f+=Math.min(15,Math.max(0,65-s.love));f+=Math.min(15,Math.max(0,60-s.freedom));if(s.love>=65)f-=(s.love-65)*3;f+=10;return f;}},
  {id:'romantic',
    gate:s=>s.love>=65,
    fit:s=>{let f=0;f+=Math.min(45,(s.love-65)*3.5);f+=Math.min(20,Math.max(0,s.happiness-50)*1);f+=Math.min(10,Math.max(0,s.love-s.career)*0.8);f+=Math.min(10,Math.max(0,s.love-s.wealth)*0.8);if(s.love>=70)f+=10;f+=5;return f;}},
  {id:'idealist',
    gate:s=>s.freedom>=65&&s.career<70,
    fit:s=>{let f=0;f+=Math.min(35,(s.freedom-65)*3);f+=Math.min(20,Math.max(0,s.happiness-50)*1.2);f+=Math.min(15,Math.max(0,65-s.career));f+=Math.min(10,Math.max(0,s.freedom-s.wealth)*0.5);f+=5;return f;}},
  {id:'hedonist',
    gate:s=>s.happiness>=65&&s.freedom>=60,
    fit:s=>{let f=0;f+=Math.min(30,(s.happiness-65)*3);f+=Math.min(25,(s.freedom-60)*2);f+=Math.min(15,Math.max(0,55-s.wealth));f+=Math.min(10,Math.max(0,55-s.career));f+=5;return f;}},
  {id:'fighter',
    gate:s=>s.career>=62&&s.freedom<53&&s.happiness<60,
    fit:s=>{let f=0;f+=Math.min(25,(s.career-62)*2);f+=Math.min(25,(53-s.freedom)*2);f+=Math.min(20,(60-s.happiness)*1.5);f+=Math.min(10,Math.max(0,s.wealth-45)*0.5);f+=5;return f;}},
  {id:'caretaker',
    gate:s=>s.love>=60&&s.love>s.career&&s.career<68,
    fit:s=>{let f=0;f+=Math.min(30,(s.love-60)*2.5);f+=Math.min(20,(s.love-s.career)*1.5);f+=Math.min(15,Math.max(0,60-s.freedom));f+=Math.min(15,Math.max(0,s.happiness-45)*0.8);f+=5;return f;}},
  {id:'minimalist',
    gate:s=>s.career<58&&s.wealth<58&&s.freedom>=55,
    fit:s=>{let f=0;f+=Math.min(20,(58-s.career)*2);f+=Math.min(20,(58-s.wealth)*2);f+=Math.min(20,(s.freedom-55)*1.5);f+=Math.min(15,Math.max(0,s.happiness-45)*1);f+=5;return f;}},
  {id:'hexagon',
    gate:s=>{const v=ATTRS.map(a=>s[a]);return Math.min(...v)>=50&&Math.max(...v)-Math.min(...v)<=25;},
    fit:s=>{const v=ATTRS.map(a=>s[a]);const mn=Math.min(...v),mx=Math.max(...v),avg=v.reduce((a,b)=>a+b)/5;let f=0;f+=Math.min(30,(25-(mx-mn))*2);f+=Math.min(30,(avg-50)*1.5);f+=Math.min(20,(mn-50)*2);f+=5;return f;}},
  {id:'stable',
    gate:s=>s.happiness>=55&&s.love>=50&&ATTRS.every(a=>s[a]>=38),
    fit:s=>{const mn=Math.min(...ATTRS.map(a=>s[a])),mx=Math.max(...ATTRS.map(a=>s[a]));let f=0;f+=Math.min(25,(s.happiness-55)*2);f+=Math.min(20,(s.love-50)*1.5);f+=Math.min(15,(mn-38)*1);f+=Math.min(10,Math.max(0,30-(mx-mn))*0.5);f+=5;return f;}},
  {id:'latebloomer',
    gate:s=>{const sum=ATTRS.reduce((t,a)=>t+s[a],0);return sum>=230&&sum<=350&&s.happiness>=50;},
    fit:s=>{const sum=ATTRS.reduce((t,a)=>t+s[a],0);let f=0;f+=Math.min(25,Math.max(0,25-Math.abs(sum-280)*0.3));f+=Math.min(20,(s.happiness-50)*1.5);const mx=Math.max(...ATTRS.map(a=>s[a]));f+=Math.min(15,Math.max(0,75-mx));f+=5;return f;}},
  {id:'explorer',
    gate:s=>{const v=ATTRS.map(a=>s[a]);return Math.max(...v)-Math.min(...v)>=33;},
    fit:s=>{const v=ATTRS.map(a=>s[a]);const range=Math.max(...v)-Math.min(...v);let f=0;f+=Math.min(30,(range-33)*1.2);f+=Math.min(15,Math.max(0,s.freedom-45)*0.8);f+=5;return f;}},
  {id:'ordinary',gate:()=>true,fit:()=>0}
];
function _scoredMatch(attrs,excludeId){
  let best=null,bestFit=-1;
  for(const m of TYPE_MATCHERS){
    if(excludeId&&m.id===excludeId)continue;
    if(!m.gate(attrs))continue;
    const f=m.fit(attrs);
    if(f>bestFit){bestFit=f;best=m.id;}
  }
  const tid=best||'ordinary';
  return RESULT_TYPES.find(t=>t.id===tid)||RESULT_TYPES[RESULT_TYPES.length-1];
}
function matchType(attrs){return _scoredMatch(attrs,null);}
function matchTypeExcluding(attrs,excludeId){return _scoredMatch(attrs,excludeId);}
// TYPE_CONTRAST: how different two types feel (higher = more dramatic parallel)
const TYPE_GROUPS={
  driven:['hustler','ambitious','fighter'],     // 事业/拼搏型
  free:['idealist','hedonist','minimalist'],     // 自由/享乐型
  love:['romantic','caretaker'],                  // 情感型
  balanced:['stable','hexagon','latebloomer'],   // 均衡/中间型
  wild:['explorer'],                              // 极端分化型
  default:['ordinary']
};
function _typeGroup(id){for(const[g,ids]of Object.entries(TYPE_GROUPS)){if(ids.includes(id))return g;}return 'default';}
function _typeContrast(idA,idB){
  if(idA===idB)return 0;
  const gA=_typeGroup(idA),gB=_typeGroup(idB);
  // Same group = low contrast
  if(gA===gB)return 1;
  // Cross-group contrast scores
  const HIGH_CONTRAST=[['driven','free'],['driven','love'],['free','love'],['driven','balanced'],['free','wild'],['love','wild']];
  const pair=[gA,gB].sort().join(',');
  for(const[a,b]of HIGH_CONTRAST){if(pair===[a,b].sort().join(','))return 3;}
  return 2; // moderate contrast
}

function calcParallel(choices,allQuestions,riskTaker,myTypeId){
  function _buildAlts(choiceIndices){
    return choiceIndices.map(idx=>{
      const c=choices[idx];
      const q=allQuestions.find(qq=>qq.id===c.questionId);
      const alts=q.options.filter(o=>o.id!==c.optionId);
      return{idx,questionId:c.questionId,chosenId:c.optionId,alts,phase:q.phase,age:q.age};
    });
  }
  function _searchBest(slotAlts,maxSwaps){
    let bestCombo=null,bestScore=-1,bestAltAttrs=null,bestAltType=null;
    const K=slotAlts.length;
    // Generate combos: 1..maxSwaps swaps
    const combos=[];
    for(let i=0;i<K;i++){for(const a of slotAlts[i].alts){combos.push([{sIdx:i,altId:a.id,altTitle:a.title}]);}}
    if(maxSwaps>=2){for(let i=0;i<K;i++){for(let j=i+1;j<K;j++){for(const ai of slotAlts[i].alts){for(const aj of slotAlts[j].alts){combos.push([{sIdx:i,altId:ai.id,altTitle:ai.title},{sIdx:j,altId:aj.id,altTitle:aj.title}]);}}}}}
    if(maxSwaps>=3&&K<=6){for(let i=0;i<K;i++){for(let j=i+1;j<K;j++){for(let k=j+1;k<K;k++){for(const ai of slotAlts[i].alts){for(const aj of slotAlts[j].alts){for(const ak of slotAlts[k].alts){combos.push([{sIdx:i,altId:ai.id,altTitle:ai.title},{sIdx:j,altId:aj.id,altTitle:aj.title},{sIdx:k,altId:ak.id,altTitle:ak.title}]);}}}}}}}
    for(const combo of combos){
      const swapMap={};
      combo.forEach(s=>{const sa=slotAlts[s.sIdx];swapMap[sa.questionId]=s.altId;});
      const altChoices=choices.map(c=>{if(swapMap[c.questionId])return{questionId:c.questionId,optionId:swapMap[c.questionId],phase:c.phase};return c;});
      const altAttrs=calcAttrs(altChoices,allQuestions,riskTaker);
      const altType=_scoredMatch(altAttrs,myTypeId);
      const contrast=_typeContrast(myTypeId,altType.id);
      let attrDist=0;ATTRS.forEach(a=>{attrDist+=Math.abs(altAttrs[a]-(state.attrs[a]||50));});
      const score=contrast*120+attrDist*0.5-combo.length*3;
      if(score>bestScore){bestScore=score;bestCombo=combo;bestAltAttrs=altAttrs;bestAltType=altType;}
    }
    return{bestCombo,bestScore,bestAltAttrs,bestAltType,slotAlts};
  }
  // Phase 1: search key choices only
  const keyIndices=[];choices.forEach((c,i)=>{const q=allQuestions.find(qq=>qq.id===c.questionId);if(q&&q.isKey)keyIndices.push(i);});
  const r1=_searchBest(_buildAlts(keyIndices),3);
  // Check if contrast is high enough (>=2 = cross-group)
  const r1Contrast=r1.bestAltType?_typeContrast(myTypeId,r1.bestAltType.id):0;
  let final=r1;
  // Phase 2: if contrast too low, include ALL choices
  if(r1Contrast<2){
    const allIndices=choices.map((_,i)=>i);
    const r2=_searchBest(_buildAlts(allIndices),3);
    const r2Contrast=r2.bestAltType?_typeContrast(myTypeId,r2.bestAltType.id):0;
    if(r2.bestScore>r1.bestScore)final=r2;
  }
  // Build swapped display info
  const swapped=(final.bestCombo||[]).map(s=>{
    const sa=final.slotAlts[s.sIdx];
    const q=allQuestions.find(qq=>qq.id===sa.questionId);
    const chosen=q.options.find(o=>o.id===sa.chosenId);
    const alt=q.options.find(o=>o.id===s.altId);
    return{questionId:sa.questionId,chosenId:sa.chosenId,chosenTitle:chosen.title,altId:s.altId,altTitle:alt.title,phase:sa.phase,age:sa.age};
  }).sort((a,b)=>a.age-b.age);
  return{altAttrs:final.bestAltAttrs||state.attrs,altType:final.bestAltType||RESULT_TYPES[RESULT_TYPES.length-1],swapped};
}

function describeAltLife(altType, altAttrs, myAttrs){
  const diffs=[];
  if(altAttrs.career-myAttrs.career>=10) diffs.push('事业上走得更稳');
  else if(myAttrs.career-altAttrs.career>=10) diffs.push('事业的野心没那么大');
  if(altAttrs.wealth-myAttrs.wealth>=10) diffs.push('经济上更宽裕');
  else if(myAttrs.wealth-altAttrs.wealth>=10) diffs.push('在金钱上不那么执着');
  if(altAttrs.love-myAttrs.love>=10) diffs.push('对爱情投入了更多');
  else if(myAttrs.love-altAttrs.love>=10) diffs.push('把感情放在了次要位置');
  if(altAttrs.freedom-myAttrs.freedom>=10) diffs.push('换来了更多的自由');
  else if(myAttrs.freedom-altAttrs.freedom>=10) diffs.push('为了其他东西牺牲了自由');
  if(altAttrs.happiness-myAttrs.happiness>=10) diffs.push('日子过得更自在');
  else if(myAttrs.happiness-altAttrs.happiness>=10) diffs.push('快乐不是那个版本的人生的重点');
  const profile=altType.profile;
  let desc=`在另一条路上，你成了「${altType.name}」——`;
  desc+=`${profile.city}，${profile.job}，年收入 ¥${profile.income}。`;
  if(diffs.length>0) desc+=`和现在的你相比，那个你${diffs.slice(0,3).join('，')}。`;
  desc+=`${altType.oneliner}`;
  return desc;
}

function getScenario(question){
  // 1. Check stage-based dynamic scenarios
  const stageSc = STAGE_SCENARIOS[question.id];
  if(stageSc && stageSc[state.userStage]) return stageSc[state.userStage];
  // 2. Check previous-choice conditional scenarios
  const cond = CONDITIONAL_SCENARIOS[question.id];
  if(cond){for(const c of cond.conditions){const prev=state.choices.find(ch=>ch.questionId===c.prevQ);if(prev&&c.prevOpts.includes(prev.optionId))return c.newScenario;}}
  return question.scenario;
}

function startExperiment(){
  state={timeline:null,riskTaker:false,userStage:'',attrs:{career:50,wealth:50,love:50,freedom:50,happiness:50},choices:[],allQuestions:[],currentQIdx:0,originStep:0,originAnswers:[]};
  renderOrigin();showScreen('screen-origin');
}
function renderOrigin(){
  const q=ORIGIN_QUESTIONS[state.originStep];
  document.getElementById('screen-origin').innerHTML=`<div class="origin-step">STEP ${q.step}</div><div class="origin-q">${q.title}</div><div class="origin-options">${q.options.map(o=>`<div class="origin-opt" onclick="selectOrigin(this,'${o.id}')">${o.title}</div>`).join('')}</div>`;
}
function selectOrigin(el,optId){
  document.querySelectorAll('.origin-opt').forEach(e=>e.classList.remove('selected'));el.classList.add('selected');
  const q=ORIGIN_QUESTIONS[state.originStep];const opt=q.options.find(o=>o.id===optId);
  state.originAnswers.push({questionId:q.id,optionId:optId});
  if(state.originStep===0){state.timeline=opt.timeline;state.userStage=optId;}
  if(state.originStep===1&&opt.effects)ATTRS.forEach(a=>{state.attrs[a]+=opt.effects[a]||0;});
  if(state.originStep===2){if(opt.effects)ATTRS.forEach(a=>{state.attrs[a]+=opt.effects[a]||0;});state.riskTaker=opt.riskTaker||false;}
  setTimeout(()=>{state.originStep++;if(state.originStep<ORIGIN_QUESTIONS.length){const s=document.getElementById('screen-origin');s.style.opacity='0';setTimeout(()=>{renderOrigin();s.style.opacity='1';},250);}else{const tl=state.timeline==='student'?STUDENT_TIMELINE:CAREER_TIMELINE;state.allQuestions=[];tl.phases.forEach(p=>{state.allQuestions.push(...p.questions);});state.currentQIdx=0;renderGame();showScreen('screen-game');}},300);
}
function renderGame(){
  const q=state.allQuestions[state.currentQIdx];const tl=state.timeline==='student'?STUDENT_TIMELINE:CAREER_TIMELINE;
  const phaseInfo=tl.phases[q.phase];const endAge=tl.ages[tl.ages.length-1];const pct=Math.round((state.currentQIdx/state.allQuestions.length)*100);
  const scenario=getScenario(q);
  document.getElementById('game-inner').innerHTML=`
    <div class="progress-wrap"><div class="progress-top"><span class="progress-phase">${phaseInfo.label}</span><span class="progress-age">${q.age} / ${endAge}</span></div><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div></div>
    <div class="q-scenario">${scenario}</div>
    <div class="options" id="options-container">${q.options.map(o=>`<div class="option-card" id="opt-${o.id}" onclick="selectOption('${q.id}','${o.id}')"><div class="option-title">${o.title}</div>${o.desc?`<div class="option-desc">${o.desc}</div>`:''}</div>`).join('')}</div>`;
}
function selectOption(qId,optId){
  const q=state.allQuestions.find(qq=>qq.id===qId);const opt=q.options.find(o=>o.id===optId);
  state.choices.push({questionId:qId,optionId:optId,phase:q.phase});
  const eff=applyEffects(opt.effects,q.phase,state.riskTaker,opt.riskBonus);
  ATTRS.forEach(a=>{state.attrs[a]=clamp(state.attrs[a]+eff[a]);});
  const selectedCard=document.getElementById('opt-'+optId);
  document.querySelectorAll('.option-card').forEach(c=>{if(c===selectedCard)c.classList.add('selected');else c.classList.add('disabled');});
  const tags=ATTRS.map(a=>{const v=Math.round(eff[a]);if(v===0)return '';return`<span class="effect-tag ${v>0?'positive':'negative'}">${ATTR_NAMES[a]} ${v>0?'+':''}${v}</span>`;}).filter(Boolean).join('');
  const effectsDiv=document.createElement('div');effectsDiv.className='inline-effects';effectsDiv.innerHTML=tags;selectedCard.appendChild(effectsDiv);
  setTimeout(()=>{effectsDiv.classList.add('hiding');setTimeout(()=>{showTransition(q.transition,()=>{state.currentQIdx++;if(state.currentQIdx<state.allQuestions.length){renderGame();}else{renderResult();showScreen('screen-result');}});},300);},1200);
}
function showTransition(text,cb){const overlay=document.getElementById('transition');document.getElementById('transition-text').textContent=text;overlay.classList.add('show');setTimeout(()=>{cb();setTimeout(()=>{overlay.classList.remove('show');},200);},1800);}

// ======== RESULT ========
function renderResult(){
  const attrs=state.attrs;const type=matchType(attrs);
  const parallel=calcParallel(state.choices,state.allQuestions,state.riskTaker,type.id);
  const p=type.profile;const ap=parallel.altType.profile;
  const tl=state.timeline==='student'?STUDENT_TIMELINE:CAREER_TIMELINE;const endAge=tl.ages[tl.ages.length-1];
  const C=type.color;const C20=C+'33';const C40=C+'66';
  const storyParts=type.story.split('\n\n');const storyLead=storyParts[0].replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');
  const storyRest=storyParts.slice(1).map(para=>'<p>'+para.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')+'</p>').join('');
  const altStoryHtml=parallel.altType.story.split('\n\n').map(para=>'<p>'+para.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')+'</p>').join('');
  const ATTR_ICONS={career:'💼',wealth:'💰',love:'❤️',freedom:'🕊️',happiness:'✨'};
  function attrLevel(v){if(v>=75)return['极高'];if(v>=60)return['偏高'];if(v>=45)return['中等'];return['偏低'];}
  const attrBars=ATTRS.map(a=>{const lvl=attrLevel(attrs[a]);return`<div class="attr-row-enhanced"><div class="attr-icon">${ATTR_ICONS[a]}</div><div class="attr-name" style="width:38px;color:${C};font-size:14px">${ATTR_NAMES_CN[a]}</div><div class="attr-bar-bg" style="flex:1"><div class="attr-bar-enhanced" style="--w:${attrs[a]}%;width:${attrs[a]}%;background:linear-gradient(90deg,${C},${C40});box-shadow:0 0 10px ${C20};animation:barGrow 1s ease both"></div></div><div class="attr-level mid" style="color:${C};background:${C20};border:1px solid ${C20}">${lvl}</div></div>`;}).join('');
  const altLifeDesc=describeAltLife(parallel.altType,parallel.altAttrs,attrs);
  const myBars=ATTRS.map(a=>`<div class="col-attr"><div class="a-name" style="color:${C}">${ATTR_NAMES_CN[a]}</div><div class="a-bar-bg"><div class="a-bar" style="width:${attrs[a]}%;background:${C}"></div></div><div class="a-val" style="color:${C}">${attrs[a]}</div></div>`).join('');
  const altC=parallel.altType.color;
  const altBars=ATTRS.map(a=>`<div class="col-attr"><div class="a-name" style="color:${altC}">${ATTR_NAMES_CN[a]}</div><div class="a-bar-bg"><div class="a-bar" style="width:${parallel.altAttrs[a]}%;background:${altC}"></div></div><div class="a-val" style="color:${altC}">${parallel.altAttrs[a]}</div></div>`).join('');
  const diffTags=ATTRS.map(a=>{const d=parallel.altAttrs[a]-attrs[a];if(d===0)return '';return`<span class="diff-tag ${d>0?'up':'down'}">${ATTR_NAMES[a]} ${d>0?'+':''}${d}</span>`;}).filter(Boolean).join('');
  const altDetailBars=ATTRS.map(a=>`<div class="attr-row"><div class="attr-name" style="color:${altC}">${ATTR_NAMES_CN[a]}</div><div class="attr-bar-bg"><div class="attr-bar" style="--w:${parallel.altAttrs[a]}%;width:${parallel.altAttrs[a]}%;background:${altC}"></div></div><div class="attr-val" style="color:${altC}">${parallel.altAttrs[a]}</div></div>`).join('');
  const el=document.getElementById('screen-result');
  // Apply type color as CSS custom properties
  el.style.setProperty('--tc',C);el.style.setProperty('--tc20',C20);el.style.setProperty('--tc40',C40);
  el.innerHTML=`
    <div class="result-header">
      <div class="result-badge" style="border-color:${C40};color:${C};background:${C20}">人 生 实 验 完 成</div>
      <div class="result-emoji">${type.emoji}</div>
      <div class="result-type" style="color:${C};-webkit-text-fill-color:${C};background:none;filter:none;text-shadow:0 0 20px ${C40}">${type.name}</div>
      <div class="result-oneliner">${type.oneliner}</div>
      <div class="result-income-tag" style="color:${C};border-color:${C40};background:${C20}">¥${p.income} / 年</div>
      <div class="result-rarity" style="color:${C};border-color:${C40};background:${C20}"><span class="rarity-dot" style="background:${C};box-shadow:0 0 8px ${C}"></span>人群中 ${type.rarity} 和你是同类</div>
    </div>
    <div class="glow-line" style="background:linear-gradient(90deg,transparent,${C40},${C},${C40},transparent)"></div>
    <div class="profile-card card-decorated" style="border-color:${C20}">
      <div class="corner-deco tl" style="border-color:${C}"></div><div class="corner-deco tr" style="border-color:${C}"></div><div class="corner-deco bl" style="border-color:${C}"></div><div class="corner-deco br" style="border-color:${C}"></div>
      <div style="height:2px;background:linear-gradient(90deg,transparent,${C40},transparent);margin-bottom:18px"></div>
      <div class="section-label" style="color:${C}">📍 你的 ${endAge} 岁</div>
      <div class="profile-grid">
        <div class="profile-item" style="border-color:${C20}"><div class="label">🏙️ 城市</div><div class="value">${p.city}</div></div>
        <div class="profile-item" style="border-color:${C20}"><div class="label">💼 职业</div><div class="value">${p.job}</div></div>
        <div class="profile-item" style="border-color:${C20}"><div class="label">❤️ 感情</div><div class="value">${p.love}</div></div>
        <div class="profile-item" style="border-color:${C20}"><div class="label">🏦 存款</div><div class="value">¥${p.savings}</div></div>
      </div>
    </div>
    <div class="radar-wrap card-decorated" style="border-color:${C20}">
      <div class="corner-deco tl" style="border-color:${C}"></div><div class="corner-deco tr" style="border-color:${C}"></div><div class="corner-deco bl" style="border-color:${C}"></div><div class="corner-deco br" style="border-color:${C}"></div>
      <div class="section-label" style="color:${C}">🎯 人生属性</div>
      <canvas id="radar-canvas" width="300" height="300"></canvas>
    </div>
    <div class="attrs-list">${attrBars}</div>
    <div class="glow-line" style="background:linear-gradient(90deg,transparent,${C40},${C},${C40},transparent)"></div>
    <div class="story-card card-decorated" style="border-color:${C20}">
      <div class="corner-deco tl" style="border-color:${C}"></div><div class="corner-deco tr" style="border-color:${C}"></div><div class="corner-deco bl" style="border-color:${C}"></div><div class="corner-deco br" style="border-color:${C}"></div>
      <div class="scan-line" style="background:linear-gradient(90deg,transparent,${C},transparent)"></div>
      <div class="section-label" style="color:${C}">📖 你的人生故事</div>
      <div class="story-lead" style="color:#fff">${storyLead}</div>
      ${storyRest}
    </div>
    <div class="glow-line" style="background:linear-gradient(90deg,transparent,${C40},${C},${C40},transparent)"></div>
    <div class="parallel-section">
      <div class="parallel-title" style="color:${C}">🌌 如果你选了另一条路…</div>
      <div class="parallel-changes" style="font-size:13px;color:var(--sub);line-height:1.9;padding:16px;background:var(--card);border:1px solid ${C20};border-radius:var(--radius)">${altLifeDesc}</div>
      <div class="parallel-compare"><div class="parallel-col mine" style="border-color:${C40}"><div class="col-emoji">${type.emoji}</div><div class="col-type" style="color:${C}">${type.name}</div>${myBars}</div><div class="parallel-col alt" style="border-color:${altC}66"><div class="col-emoji">${parallel.altType.emoji}</div><div class="col-type" style="color:${altC}">${parallel.altType.name}</div>${altBars}</div></div>
      <div class="parallel-diff">${diffTags}</div>
      <div class="parallel-hint">${type.parallelHint}</div>
      <div class="alt-life-btn" onclick="toggleAltLife()" style="color:${altC};border-color:${altC}66;background:${altC}10">👁 查看「${parallel.altType.name}」的完整人生 →</div>
      <div class="alt-life-detail" id="alt-life-detail">
        <div class="alt-header"><div class="alt-emoji">${parallel.altType.emoji}</div><div class="alt-type" style="color:${altC}">${parallel.altType.name}</div><div class="alt-oneliner">${parallel.altType.oneliner}</div></div>
        <div class="glow-line" style="background:linear-gradient(90deg,transparent,${altC}66,${altC},${altC}66,transparent)"></div>
        <div class="alt-profile"><div class="alt-profile-item" style="border-color:${altC}30"><div class="label">城市</div><div class="value" style="color:${altC}">${ap.city}</div></div><div class="alt-profile-item" style="border-color:${altC}30"><div class="label">职业</div><div class="value" style="color:${altC}">${ap.job}</div></div><div class="alt-profile-item" style="border-color:${altC}30"><div class="label">年收入</div><div class="value" style="color:${altC}">¥${ap.income}</div></div><div class="alt-profile-item" style="border-color:${altC}30"><div class="label">感情</div><div class="value" style="color:${altC}">${ap.love}</div></div></div>
        ${altDetailBars}
        <div class="glow-line" style="background:linear-gradient(90deg,transparent,${altC}66,${altC},${altC}66,transparent)"></div>
        <div class="alt-story">${altStoryHtml}</div>
      </div>
    </div>
    <div class="action-btns"><button class="btn-secondary" onclick="startExperiment()" style="color:${C};border-color:${C40}">🔄 重新开始实验</button></div>`;
  setTimeout(()=>drawRadar(attrs),100);addParticles();
  try{localStorage.setItem('life_lab_result',JSON.stringify({type:type.id,attrs,choices:state.choices,timeline:state.timeline,time:Date.now()}));}catch(e){}
}
function toggleAltLife(){const d=document.getElementById('alt-life-detail');const b=document.querySelector('.alt-life-btn');if(d.classList.contains('show')){d.classList.remove('show');b.innerHTML=b.innerHTML.replace('收起','查看').replace('↑','→');}else{d.classList.add('show');b.innerHTML=b.innerHTML.replace('查看','收起').replace('→','↑');d.scrollIntoView({behavior:'smooth',block:'nearest'});}}
function addParticles(){document.querySelectorAll('.card-decorated').forEach(card=>{for(let i=0;i<3;i++){const p=document.createElement('div');p.className='float-particle';p.style.left=(15+Math.random()*70)+'%';p.style.bottom='10px';p.style.animationDelay=Math.random()*4+'s';p.style.animationDuration=(4+Math.random()*4)+'s';card.appendChild(p);}});}

// ======== RADAR ========
function drawRadar(attrs){
  const canvas=document.getElementById('radar-canvas');if(!canvas)return;const ctx=canvas.getContext('2d');const dpr=window.devicePixelRatio||1;
  const type=matchType(attrs);const C=type.color;
  const sz=300;canvas.width=sz*dpr;canvas.height=sz*dpr;canvas.style.width=sz+'px';canvas.style.height=sz+'px';ctx.scale(dpr,dpr);
  const cx=sz/2,cy=sz/2,r=110,labels=ATTRS.map(a=>ATTR_NAMES_CN[a]),values=ATTRS.map(a=>attrs[a]/100),n=5,angleStep=(Math.PI*2)/n,startAngle=-Math.PI/2;
  // Grid rings
  for(let ring=1;ring<=4;ring++){const rr=r*ring/4;ctx.beginPath();for(let i=0;i<=n;i++){const angle=startAngle+i*angleStep;const x=cx+Math.cos(angle)*rr;const y=cy+Math.sin(angle)*rr;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}ctx.closePath();ctx.strokeStyle=ring===4?C+'30':C+'15';ctx.lineWidth=1;ctx.stroke();}
  // Spokes
  for(let i=0;i<n;i++){const angle=startAngle+i*angleStep;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(angle)*r,cy+Math.sin(angle)*r);ctx.strokeStyle=C+'15';ctx.lineWidth=1;ctx.stroke();}
  // Fill area
  ctx.beginPath();for(let i=0;i<=n;i++){const idx=i%n;const angle=startAngle+idx*angleStep;const v=values[idx]*r;const x=cx+Math.cos(angle)*v;const y=cy+Math.sin(angle)*v;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}ctx.closePath();
  ctx.fillStyle=C+'25';ctx.fill();
  // Stroke with glow
  ctx.save();ctx.shadowColor=C;ctx.shadowBlur=15;ctx.strokeStyle=C+'cc';ctx.lineWidth=2.5;ctx.stroke();ctx.restore();
  // Dots + labels — all in type color
  for(let i=0;i<n;i++){const angle=startAngle+i*angleStep;const v=values[i]*r;const x=cx+Math.cos(angle)*v;const y=cy+Math.sin(angle)*v;
    ctx.beginPath();ctx.arc(x,y,9,0,Math.PI*2);ctx.fillStyle=C+'25';ctx.fill();
    ctx.save();ctx.shadowColor=C;ctx.shadowBlur=10;ctx.beginPath();ctx.arc(x,y,4.5,0,Math.PI*2);ctx.fillStyle=C;ctx.fill();ctx.restore();
    const lx=cx+Math.cos(angle)*(r+28);const ly=cy+Math.sin(angle)*(r+28);
    ctx.fillStyle=C;ctx.font='700 13px -apple-system,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(labels[i],lx,ly);}
}


document.body.addEventListener('touchmove',function(e){},{passive:true});

// ======== DECORATIONS ========
(function(){
  const container=document.getElementById('stars-bg');
  for(let i=0;i<120;i++){
    const star=document.createElement('div');star.className='star';
    star.style.left=Math.random()*100+'%';star.style.top=Math.random()*100+'%';
    star.style.animationDelay=Math.random()*5+'s';star.style.animationDuration=(2+Math.random()*5)+'s';
    if(Math.random()>0.5){star.style.width=star.style.height='3px';star.style.background='rgba(124,131,253,0.6)';star.style.boxShadow='0 0 4px rgba(124,131,253,0.3)';}
    if(Math.random()>0.75){star.style.width=star.style.height='4px';star.style.background='rgba(0,212,255,0.7)';star.style.boxShadow='0 0 8px rgba(0,212,255,0.5)';}
    if(Math.random()>0.92){star.style.width=star.style.height='5px';star.style.background='rgba(255,255,255,0.8)';star.style.boxShadow='0 0 12px rgba(0,212,255,0.6)';}
    container.appendChild(star);
  }
  // Orbit rings on home
  const orbits=document.getElementById('home-orbits');
  if(orbits){
    [80,120,160].forEach((r,idx)=>{
      const ring=document.createElement('div');ring.className='orbit-ring';ring.style.width=ring.style.height=r*2+'px';orbits.appendChild(ring);
      const dot=document.createElement('div');dot.className='orbit-dot';dot.style.setProperty('--orbit-r',r+'px');dot.style.animationDuration=(12+idx*6)+'s';dot.style.animationDelay=idx*2+'s';orbits.appendChild(dot);
    });
  }
  // Hex dots for PC
  if(window.innerWidth>=1024){
    const positions=[[5,20],[8,50],[6,80],[92,25],[94,55],[91,85],[3,35],[97,40],[5,65],[95,70]];
    positions.forEach(([x,y])=>{const dot=document.createElement('div');dot.className='hex-dot';dot.style.left=x+'%';dot.style.top=y+'%';document.body.appendChild(dot);});
  }
})();
</script>
